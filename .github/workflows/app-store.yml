name: Mac App Store

# Ships the sandboxed BrowBroMAS target: archive, upload, product page, submit.
#
# READ THIS BEFORE PUBLISHING A RELEASE. This workflow used to stop after the
# upload, and its safety argument was that uploading is not publishing. That is no
# longer true: on a published (non-prerelease) GitHub Release it now also attaches
# the build to the version, pushes the product page, and submits for review. A
# `gh release publish` therefore puts BrowBro in front of App Review. Cut a
# prerelease, or dispatch with submit=false, when that is not what you want.
#
# Why CI and not a maintainer's Mac: App Store Connect refuses builds made with a
# beta or Release Candidate Xcode (ITMS-90301). That was once an absolute barrier
# here — an Xcode old enough to be accepted would not launch on a prerelease macOS
# — but it is a question of which toolchain is installed, not of which machine:
# BrowBro 1.0 (8) and (9) were both uploaded by hand from a maintainer's Mac on
# 2026-09-13 once Xcode 27.0 shipped. CI remains the default because the runner is
# a known-good production macOS and because it is the only place the release
# trigger can reach.
#
# The DMG / Homebrew / Sparkle channel is untouched: it is still cut by hand with
# packaging/notarize/notarize-release.sh (docs/NOTARIZING.md), because it needs the
# Developer ID identity and the EdDSA update key that never leave that machine.

on:
  # Every published GitHub Release ships the store channel too, so the two
  # channels can't silently drift to different versions.
  release:
    types: [published]

  # The manual entry point. Needed for a first upload, and for re-uploading after
  # Connect rejects a build — neither of which is worth cutting a release for.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: ""
      build_number:
        description: "Override CFBundleVersion (empty = ask Connect for the next free one)"
        required: false
        default: ""
      dry_run:
        description: "Archive and verify, but do not upload"
        type: boolean
        required: false
        default: false
      submit:
        description: "Submit the version for App Review after uploading"
        type: boolean
        required: false
        default: false
      screenshots:
        description: "Also replace the screenshots on the product page"
        type: boolean
        required: false
        default: false

# One upload at a time. Two runs racing would burn build numbers and leave it
# ambiguous which archive Connect actually kept.
concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26

    env:
      # Connect accepts builds only from a released Xcode, and lags a new major by
      # days. Raise this once `xcrun altool`/Connect stops rejecting the next one —
      # the point of the pin is that a runner image update can't silently start
      # producing uploads that fail validation.
      MAX_XCODE_MAJOR: "26"
      ARCHIVE: ${{ github.workspace }}/build/BrowBroMAS.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/mas-export

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A release builds its own tag; a manual run builds whatever it was
          # pointed at, defaulting to the branch the workflow was dispatched from.
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Select a released Xcode
        run: |
          set -euo pipefail
          best=""; best_ver=""
          for app in /Applications/Xcode*.app; do
            ver=$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null) || continue
            major=${ver%%.*}
            [ "$major" -le "$MAX_XCODE_MAJOR" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$ver" "$best_ver" | sort -V | tail -1)" = "$ver" ]; then
              best="$app"; best_ver="$ver"
            fi
          done
          if [ -z "$best" ]; then
            echo "✗ No Xcode ≤ $MAX_XCODE_MAJOR on this runner. Available:" >&2
            ls -d /Applications/Xcode*.app >&2
            echo "  App Store Connect rejects newer ones with ITMS-90301 until Apple" >&2
            echo "  flips the flag; raise MAX_XCODE_MAJOR once it has." >&2
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificates
        env:
          CERT_P12_BASE64: ${{ secrets.MAS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MAS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERT_P12_BASE64:?MAS_CERT_P12_BASE64 secret is not set — see docs/MAS.md}"

          # A throwaway keychain, not the login one: the runner is disposable, and
          # this keeps the private keys out of any keychain a later step might dump.
          KEYCHAIN="$RUNNER_TEMP/mas-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          P12="$RUNNER_TEMP/mas-certs.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$P12"

          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it on the search list so xcodebuild finds the identities.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[A-F0-9]\{40\}/<hash>/'

          # The store package needs both halves: Apple Distribution signs the app,
          # 3rd Party Mac Developer Installer signs the .pkg that carries it. A p12
          # with only the first fails at export, long after the build succeeded.
          security find-identity -v "$KEYCHAIN" | grep -q "Apple Distribution" ||
            { echo "✗ No 'Apple Distribution' identity in the p12." >&2; exit 1; }
          security find-identity -v "$KEYCHAIN" | grep -q "3rd Party Mac Developer Installer" ||
            { echo "✗ No '3rd Party Mac Developer Installer' identity in the p12 — export both certificates into one file (docs/MAS.md)." >&2; exit 1; }

      - name: Write the App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${ASC_KEY:?APPSTORE_CONNECT_PRIVATE_KEY secret is not set — see docs/MAS.md}"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${PROFILE_BASE64:?MAS_PROVISIONING_PROFILE_BASE64 secret is not set — see docs/MAS.md}"

          # Xcode has looked in both of these across versions. Writing both costs
          # nothing and removes a failure that depends on the runner image.
          PROFILE=""
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_BASE64" | base64 --decode > "$dir/browbro-mas.provisionprofile"
            PROFILE="$dir/browbro-mas.provisionprofile"
          done

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print $1" "$RUNNER_TEMP/profile.plist" 2>/dev/null; }
          NAME=$(read_key ":Name")
          APPID=$(read_key ":Entitlements:com.apple.application-identifier")
          echo "Profile: $NAME"
          echo "App ID:  $APPID"
          echo "Expires: $(read_key ':ExpirationDate')"

          case "$APPID" in
            *.cloud.tiagomoraes.browbro) ;;
            *) echo "✗ Profile is for '$APPID', not cloud.tiagomoraes.browbro." >&2; exit 1 ;;
          esac

          # Xcode writes its own profiles when it archives with automatic signing,
          # and those are the ones lying around on a developer's Mac — but manual
          # signing refuses them ("is Xcode managed, but signing settings require a
          # manually managed profile"). The profile has to be created in the
          # developer portal instead. Catch it here, where the message can say so,
          # rather than at export where it can't.
          #
          # Two tests, because one is not enough: run 34575742352 shipped an
          # Xcode-managed profile that carried no IsXcodeManaged key at all, passed
          # this guard, and failed at export. Xcode names what it generates
          # "Mac Team <kind> Provisioning Profile: <bundle id>", and a portal
          # profile is named by whoever created it, so the name is the tell the
          # missing key isn't.
          XCODE_MANAGED=""
          [ "$(read_key ':IsXcodeManaged')" = "true" ] && XCODE_MANAGED="IsXcodeManaged is true"
          case "$NAME" in
            "Mac Team "*"Provisioning Profile: "*)
              XCODE_MANAGED="its name is the one Xcode generates" ;;
          esac
          if [ -n "$XCODE_MANAGED" ]; then
            echo "✗ '$NAME' looks Xcode-managed ($XCODE_MANAGED)." >&2
            echo "  Manual signing needs a profile created at developer.apple.com →" >&2
            echo "  Certificates, Identifiers & Profiles → Profiles → + → Mac App" >&2
            echo "  Store Connect, downloaded, and stored as the secret. See docs/MAS.md." >&2
            exit 1
          fi

          # A distribution profile has no device list. One that does is a
          # development profile, which would sign an archive Connect then rejects.
          if read_key ":ProvisionedDevices" >/dev/null 2>&1; then
            echo "✗ '$NAME' carries ProvisionedDevices — that is a development" >&2
            echo "  profile, not a Mac App Store distribution one." >&2
            exit 1
          fi

          # The installed profile names itself; ExportOptions is told at export time.
          # Nothing to keep in sync, so the secret can be rotated or renamed freely.
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/profile.plist"

      - name: Generate the Xcode project
        run: xcodegen generate

      # fastlane owns the Connect side: the build number query here, and the
      # product page / submission after the upload. bundler-cache keeps the gem
      # install off the critical path on repeat runs.
      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          # Pinned here rather than in a .ruby-version file: Ruby is a CI-only
          # dependency of this repository, and setup-ruby refuses to guess.
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decide the build number
        id: build_number
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          OVERRIDE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # A build number may only be used once per version, and Connect counts
          # the ones that were uploaded and never shipped too. Asking it is the
          # only way to be right: 1.0 reached build 9 through two by-hand uploads
          # that no counter in this repository ever saw.
          if [ -n "$OVERRIDE" ]; then
            echo "build_number=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using the dispatched override → $OVERRIDE"
          else
            bundle exec fastlane mac next_build_number
          fi

      - name: Archive BrowBroMAS
        env:
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
        run: |
          set -euo pipefail
          : "${BUILD_NUMBER:?No build number was resolved}"
          echo "Archiving CFBundleVersion $BUILD_NUMBER"

          # Sign the archive manually. The target is set up for automatic signing,
          # which archives with an Apple Development identity and only switches to
          # distribution at export. That identity deliberately isn't in CI's p12 —
          # the runner gets what it needs to ship to the store and nothing else —
          # and overriding CODE_SIGN_IDENTITY on top of automatic signing is a hard
          # error ("conflicting provisioning settings"). Overriding the style too
          # takes the decision away from Xcode instead of arguing with it.
          #
          # Name the installed portal profile at both ends. Manual signing does not
          # go looking, and letting the archive and the export disagree about which
          # profile applies is its own class of failure.
          xcodebuild -project BrowBro.xcodeproj -scheme BrowBroMAS \
            -configuration Release -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Verify the store binary
        run: |
          set -euo pipefail
          APP="$ARCHIVE/Products/Applications/BrowBro.app"
          packaging/mas/verify-mas-app.sh "$APP"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist") \
          build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier"

      # packaging/mas/ExportOptions.plist is the by-hand file: automatic signing,
      # write a .pkg to disk. CI signs manually against a named portal profile,
      # which is a different plist, not two keys patched onto that one — patching
      # is what run 34575742352 did, and it left signingStyle on "automatic" while
      # the archive had been signed manually. Write the whole thing instead.
      - name: Compose the export options
        run: |
          set -euo pipefail
          OPTS="$RUNNER_TEMP/ExportOptions-ci.plist"
          DESTINATION=export
          [ "${DRY_RUN:-false}" = "true" ] || DESTINATION=upload

          cat > "$OPTS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>QD5A8CZK76</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>cloud.tiagomoraes.browbro</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$OPTS"
          echo "EXPORT_OPTS=$OPTS" >> "$GITHUB_ENV"
          echo "Exporting with destination=$DESTINATION, profile '$PROFILE_NAME'"
        env:
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Export and upload to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # No -allowProvisioningUpdates: signing is manual, the profile is already
          # installed, and there is nothing for Xcode to go fetch. The API key stays
          # because it is also what authenticates the upload itself.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTS" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # On a published, non-prerelease GitHub Release this submits for review.
      # On a dispatch it does what the inputs say. See the note at the top of the file.
      - name: Publish the product page and submit
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ steps.build_number.outputs.build_number }}
          # A prerelease is how you cut a tag without sending anything to review.
          SUBMIT: ${{ github.event_name == 'release' && !github.event.release.prerelease || inputs.submit }}
          SCREENSHOTS: ${{ inputs.screenshots || false }}
        run: |
          set -euo pipefail
          bundle exec fastlane mac wait_for_build build_number:"$BUILD_NUMBER"
          bundle exec fastlane mac publish \
            build_number:"$BUILD_NUMBER" \
            submit:"$SUBMIT" \
            screenshots:"$SCREENSHOTS"

      - name: Export a .pkg without uploading
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Local signing against the installed profile, writing a .pkg to disk.
          # Nothing leaves the runner, so there is nothing to authenticate.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTS"

      - name: Upload the .pkg as a run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: BrowBroMAS-pkg
          path: ${{ env.EXPORT_DIR }}/*.pkg
          if-no-files-found: error

      # Runs even when the build failed: a leftover unlocked keychain or a private
      # key on disk outlives the step that made it.
      - name: Clean up credentials
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-}" 2>/dev/null || true
          rm -f "${ASC_KEY_PATH:-}" "$RUNNER_TEMP/mas-certs.p12" 2>/dev/null || true
