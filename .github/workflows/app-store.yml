name: Mac App Store

# Builds the sandboxed BrowBroMAS target and uploads it to App Store Connect.
#
# Uploading is not publishing. The build lands in Connect as a processed build and
# still has to be attached to a version, have its metadata filled in, and be
# submitted for review by hand. Nothing in this workflow can put the app in front
# of users on its own — which is why running it on every published release is safe.
#
# Why this runs in CI rather than on a maintainer's Mac: App Store Connect refuses
# builds made with a beta or Release Candidate Xcode (ITMS-90301), and an Xcode old
# enough to be accepted refuses to launch on a prerelease macOS ("not compatible
# with this version of macOS"). A maintainer running a macOS seed therefore cannot
# upload from their own machine at all. The GitHub runner is a production macOS
# with a production Xcode — the combination Apple asks you to submit from.
#
# The DMG / Homebrew / Sparkle channel is untouched: it is still cut by hand with
# packaging/notarize/notarize-release.sh (docs/NOTARIZING.md), because it needs the
# Developer ID identity and the EdDSA update key that never leave that machine.

on:
  # Every published GitHub Release ships the store channel too, so the two
  # channels can't silently drift to different versions.
  release:
    types: [published]

  # The manual entry point. Needed for a first upload, and for re-uploading after
  # Connect rejects a build — neither of which is worth cutting a release for.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: false
        default: ""
      build_number:
        description: "Override CFBundleVersion (empty = CURRENT_PROJECT_VERSION from project.yml)"
        required: false
        default: ""
      dry_run:
        description: "Archive and verify, but do not upload"
        type: boolean
        required: false
        default: false

# One upload at a time. Two runs racing would burn build numbers and leave it
# ambiguous which archive Connect actually kept.
concurrency:
  group: app-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26

    env:
      # Connect accepts builds only from a released Xcode, and lags a new major by
      # days. Raise this once `xcrun altool`/Connect stops rejecting the next one —
      # the point of the pin is that a runner image update can't silently start
      # producing uploads that fail validation.
      MAX_XCODE_MAJOR: "26"
      ARCHIVE: ${{ github.workspace }}/build/BrowBroMAS.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/build/mas-export

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A release builds its own tag; a manual run builds whatever it was
          # pointed at, defaulting to the branch the workflow was dispatched from.
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Select a released Xcode
        run: |
          set -euo pipefail
          best=""; best_ver=""
          for app in /Applications/Xcode*.app; do
            ver=$(/usr/bin/defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null) || continue
            major=${ver%%.*}
            [ "$major" -le "$MAX_XCODE_MAJOR" ] || continue
            if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$ver" "$best_ver" | sort -V | tail -1)" = "$ver" ]; then
              best="$app"; best_ver="$ver"
            fi
          done
          if [ -z "$best" ]; then
            echo "✗ No Xcode ≤ $MAX_XCODE_MAJOR on this runner. Available:" >&2
            ls -d /Applications/Xcode*.app >&2
            echo "  App Store Connect rejects newer ones with ITMS-90301 until Apple" >&2
            echo "  flips the flag; raise MAX_XCODE_MAJOR once it has." >&2
            exit 1
          fi
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificates
        env:
          CERT_P12_BASE64: ${{ secrets.MAS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MAS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERT_P12_BASE64:?MAS_CERT_P12_BASE64 secret is not set — see docs/MAS.md}"

          # A throwaway keychain, not the login one: the runner is disposable, and
          # this keeps the private keys out of any keychain a later step might dump.
          KEYCHAIN="$RUNNER_TEMP/mas-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          P12="$RUNNER_TEMP/mas-certs.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$P12"

          # Without this, codesign blocks on a GUI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it on the search list so xcodebuild finds the identities.
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[A-F0-9]\{40\}/<hash>/'

          # The store package needs both halves: Apple Distribution signs the app,
          # 3rd Party Mac Developer Installer signs the .pkg that carries it. A p12
          # with only the first fails at export, long after the build succeeded.
          security find-identity -v "$KEYCHAIN" | grep -q "Apple Distribution" ||
            { echo "✗ No 'Apple Distribution' identity in the p12." >&2; exit 1; }
          security find-identity -v "$KEYCHAIN" | grep -q "3rd Party Mac Developer Installer" ||
            { echo "✗ No '3rd Party Mac Developer Installer' identity in the p12 — export both certificates into one file (docs/MAS.md)." >&2; exit 1; }

      - name: Write the App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${ASC_KEY:?APPSTORE_CONNECT_PRIVATE_KEY secret is not set — see docs/MAS.md}"
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install the provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${PROFILE_BASE64:?MAS_PROVISIONING_PROFILE_BASE64 secret is not set — see docs/MAS.md}"

          # Xcode has looked in both of these across versions. Writing both costs
          # nothing and removes a failure that depends on the runner image.
          PROFILE=""
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE_BASE64" | base64 --decode > "$dir/browbro-mas.provisionprofile"
            PROFILE="$dir/browbro-mas.provisionprofile"
          done

          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          read_key() { /usr/libexec/PlistBuddy -c "Print $1" "$RUNNER_TEMP/profile.plist" 2>/dev/null; }
          NAME=$(read_key ":Name")
          APPID=$(read_key ":Entitlements:com.apple.application-identifier")
          echo "Profile: $NAME"
          echo "App ID:  $APPID"
          echo "Expires: $(read_key ':ExpirationDate')"

          case "$APPID" in
            *.cloud.tiagomoraes.browbro) ;;
            *) echo "✗ Profile is for '$APPID', not cloud.tiagomoraes.browbro." >&2; exit 1 ;;
          esac

          # Xcode writes its own profiles when it archives with automatic signing,
          # and those are the ones lying around on a developer's Mac — but manual
          # signing refuses them ("is Xcode managed, but signing settings require a
          # manually managed profile"). The profile has to be created in the
          # developer portal instead. Catch it here, where the message can say so,
          # rather than at export where it can't.
          if [ "$(read_key ':IsXcodeManaged')" = "true" ]; then
            echo "✗ '$NAME' is an Xcode-managed profile; manual signing needs one" >&2
            echo "  created at developer.apple.com → Certificates, Identifiers &" >&2
            echo "  Profiles → Profiles → + → Mac App Store Connect. See docs/MAS.md." >&2
            exit 1
          fi

          # The installed profile names itself; ExportOptions is told at export time.
          # Nothing to keep in sync, so the secret can be rotated or renamed freely.
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/profile.plist"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Archive BrowBroMAS
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # A build number may only be used once per version. Overriding it is how
          # you re-upload after Connect accepted a build and review bounced it.
          # A plain string, not an array: the runner's /bin/bash is 3.2, where
          # expanding an empty array under `set -u` is itself an error. A build
          # number is digits, so the unquoted expansion below can't word-split.
          version_override=""
          if [ -n "$BUILD_NUMBER" ]; then
            version_override="CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
            echo "Overriding CFBundleVersion → $BUILD_NUMBER"
          fi

          # Sign the archive manually. The target is set up for automatic signing,
          # which archives with an Apple Development identity and only switches to
          # distribution at export. That identity deliberately isn't in CI's p12 —
          # the runner gets what it needs to ship to the store and nothing else —
          # and overriding CODE_SIGN_IDENTITY on top of automatic signing is a hard
          # error ("conflicting provisioning settings"). Overriding the style too
          # takes the decision away from Xcode instead of arguing with it.
          #
          # No profile here: the archive doesn't need one, and -exportArchive fetches
          # the Mac App Store profile with the API key and embeds it when it re-signs.
          # Same shape as the Developer ID path in notarize-release.sh.
          xcodebuild -project BrowBro.xcodeproj -scheme BrowBroMAS \
            -configuration Release -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            $version_override \
            archive

      - name: Verify the store binary
        run: |
          set -euo pipefail
          APP="$ARCHIVE/Products/Applications/BrowBro.app"
          packaging/mas/verify-mas-app.sh "$APP"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist") \
          build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier"

      - name: Export and upload to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The committed ExportOptions.plist writes a .pkg to disk, which is what
          # you want when exporting by hand. CI wants the upload, so flip that one
          # key on a copy rather than keeping two near-identical files in sync, and
          # name the profile that actually got installed.
          OPTS="$RUNNER_TEMP/ExportOptions-upload.plist"
          cp packaging/mas/ExportOptions.plist "$OPTS"
          plutil -replace destination -string upload "$OPTS"
          /usr/libexec/PlistBuddy -c \
            "Set :provisioningProfiles:cloud.tiagomoraes.browbro $PROFILE_NAME" "$OPTS"

          # No -allowProvisioningUpdates: signing is manual now, and asking for
          # cloud signing is what made a non-Admin key fail here. The API key stays
          # because it is also what authenticates the upload.
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$OPTS" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

          echo "✅ Uploaded. The build still has to be attached to a version and"
          echo "   submitted for review in App Store Connect — see packaging/mas/listing.md."

      - name: Export a .pkg without uploading
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Local signing against the installed profile, writing a .pkg to disk.
          # Nothing leaves the runner, so there is nothing to authenticate.
          OPTS="$RUNNER_TEMP/ExportOptions-dry.plist"
          cp packaging/mas/ExportOptions.plist "$OPTS"
          /usr/libexec/PlistBuddy -c \
            "Set :provisioningProfiles:cloud.tiagomoraes.browbro $PROFILE_NAME" "$OPTS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$OPTS"

      - name: Upload the .pkg as a run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: BrowBroMAS-pkg
          path: ${{ env.EXPORT_DIR }}/*.pkg
          if-no-files-found: error

      # Runs even when the build failed: a leftover unlocked keychain or a private
      # key on disk outlives the step that made it.
      - name: Clean up credentials
        if: always()
        run: |
          security delete-keychain "${KEYCHAIN:-}" 2>/dev/null || true
          rm -f "${ASC_KEY_PATH:-}" "$RUNNER_TEMP/mas-certs.p12" 2>/dev/null || true
