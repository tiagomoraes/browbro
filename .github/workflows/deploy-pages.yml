name: Deploy website

# Publishes the static site in `site/` to GitHub Pages, served at the custom
# domain browbro.tiagomoraes.cloud (see site/CNAME).
#
# The live site tracks `main` (the released state), so it moves in lockstep
# with tagged releases rather than day-to-day work on `develop`. The download
# buttons point at `releases/latest/download/BrowBro.dmg`, which GitHub
# redirects to the newest release's asset — so the site always offers the
# latest released build.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # v4+ leaves dotfiles out, so site/.nojekyll never reaches Pages. That is
      # fine: an Actions deploy serves the artifact as-is and never runs Jekyll.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
