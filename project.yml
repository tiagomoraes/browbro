name: BrowBro
options:
  bundleIdPrefix: cloud.tiagomoraes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # In-app updates for the DMG/Homebrew build (Sparkle is the standard for
  # non-App-Store macOS apps). Trust is anchored on an EdDSA signature over each
  # update archive, independent of Apple notarization — see docs/UPDATES.md.
  # The Mac App Store target (BrowBroMAS) does not link Sparkle: guideline
  # 2.4.5(vii) requires MAS apps to update only through the store. See docs/MAS.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: cloud.tiagomoraes.browbro
    MARKETING_VERSION: "0.1.7"
    # CFBundleVersion. Sparkle compares this to decide if an update is newer, so
    # it MUST increase on every public release (see docs/UPDATES.md).
    CURRENT_PROJECT_VERSION: "7"
    # Swift 5 language mode keeps the prototype free of strict-concurrency
    # noise; we can tighten to Swift 6 mode once the slice is proven.
    SWIFT_VERSION: "5.0"
    # Local dev signing with the "Apple Development" identity. A valid, stable
    # signature is required for macOS TCC to grant/persist access to Chrome's
    # profile data; ad-hoc builds are refused by policy. Public releases are
    # signed with Developer ID and notarized instead — those settings are
    # overridden by packaging/notarize/notarize-release.sh, not set here, so a
    # dev build can never accidentally masquerade as a release.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: "QD5A8CZK76"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Don't inject get-task-allow in Debug: it weakens the app's TCC standing.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targetTemplates:
  BrowBroApp:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: BrowBro
        COMBINE_HIDPI_IMAGES: "YES"
targets:
  BrowBro:
    templates: [BrowBroApp]
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        # SPARKLE compilation condition wires in-app updates. The MAS target
        # defines APPSTORE instead and does not link the framework.
        OTHER_SWIFT_FLAGS: "$(inherited) -D SPARKLE"
  BrowBroMAS:
    templates: [BrowBroApp]
    settings:
      base:
        INFOPLIST_FILE: Resources/Info-MAS.plist
        # The store channel versions independently of Sparkle's 0.1.x: Connect
        # holds a 1.0 macOS record, and a build number may only be used once.
        # app-store.yml reads CURRENT_PROJECT_VERSION from here.
        MARKETING_VERSION: "1.0"
        # A floor, not the value that ships. app-store.yml asks Connect for the
        # highest build already uploaded against MARKETING_VERSION and passes
        # CURRENT_PROJECT_VERSION=<that + 1> on the command line, because a build
        # number may only be used once per version. This stays as the fallback for
        # a local archive, and as the answer to "what did the last one ship as".
        CURRENT_PROJECT_VERSION: "9"
        OTHER_SWIFT_FLAGS: "$(inherited) -D APPSTORE"
        CODE_SIGN_ENTITLEMENTS: packaging/mas/BrowBro.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        # Automatic signing picks the identity from what the keychain holds and
        # what the build is for: Apple Distribution + a Mac Team Store profile for
        # a Release archive, Apple Development for a local Run.
        #
        # Pinning CODE_SIGN_IDENTITY here is what broke CI (runs 34559312376,
        # 34575742352): the runner's keychain has only Apple Distribution and the
        # 3rd Party Installer cert, so a Release archive asking for "Apple
        # Development" fails with "conflicting provisioning settings" — and
        # answering that by forcing the identity on the command line fails the
        # other way, because an Xcode-managed profile refuses manual settings.
        # Scope it to Debug: that is the only configuration that wants it.
        # Automatic signing is what a local archive wants: it signs with Apple
        # Development and -exportArchive re-signs with Apple Distribution. CI
        # overrides the style on the command line instead, because the runner
        # deliberately has no development identity — see .github/workflows/app-store.yml.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
schemes:
  BrowBro:
    build:
      targets:
        BrowBro: all
    run:
      config: Debug
  BrowBroMAS:
    build:
      targets:
        BrowBroMAS: all
    run:
      config: Debug
    archive:
      config: Release
